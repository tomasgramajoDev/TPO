name: Deploy test

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de la release aprobada que se desplegará en test.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-test
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_application_demo_password: ${{ secrets.TEST_DEMO_PASSWORD }}
  TF_VAR_application_bootstrap_users_json: ${{ secrets.TEST_BOOTSTRAP_USERS }}

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && vars.ENABLE_AUTOMATIC_DEPLOYMENTS == 'true')
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: infra/terraform/live/test

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=test.terraform.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
          -lock-timeout=5m

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start PostgreSQL before planning
        shell: bash
        run: |
          resource_group="$(terraform output -raw resource_group_name)"
          server_fqdn="$(terraform output -raw postgresql_fqdn)"
          server_name="${server_fqdn%%.*}"
          server_state="$(az postgres flexible-server show --resource-group "$resource_group" --name "$server_name" --query state --output tsv)"
          if [ "$server_state" = "Stopped" ]; then
            az postgres flexible-server start --resource-group "$resource_group" --name "$server_name"
          fi

      - name: Create plan
        run: terraform plan -input=false -lock-timeout=5m -out=test.tfplan

      - name: Render plan
        run: terraform show -no-color test.tfplan > test-plan.txt

      - name: Add plan to workflow summary
        shell: bash
        run: |
          {
            echo "## Terraform plan - test"
            echo
            echo '<details><summary>Ver plan</summary>'
            echo
            echo '```text'
            sed -n '1,1000p' test-plan.txt
            echo '```'
            echo '</details>'
            if [ "$(wc -l < test-plan.txt)" -gt 1000 ]; then
              echo
              echo "El resumen fue truncado. El plan completo está en el artefacto."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-plan
          path: |
            infra/terraform/live/test/test.tfplan
            infra/terraform/live/test/test-plan.txt
          retention-days: 7

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: infra/terraform/live/test

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=test.terraform.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
          -lock-timeout=5m

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start PostgreSQL for the test window
        shell: bash
        run: |
          resource_group="$(terraform output -raw resource_group_name)"
          server_fqdn="$(terraform output -raw postgresql_fqdn)"
          server_name="${server_fqdn%%.*}"
          server_state="$(az postgres flexible-server show --resource-group "$resource_group" --name "$server_name" --query state --output tsv)"
          if [ "$server_state" = "Stopped" ]; then
            az postgres flexible-server start --resource-group "$resource_group" --name "$server_name"
          fi

      - name: Download approved plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-test-plan
          path: infra/terraform/live/test

      - name: Show approved plan
        run: terraform show -no-color test.tfplan

      - name: Apply approved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve test.tfplan

      - name: Restart backend revision to load updated bootstrap secret
        shell: bash
        run: |
          resource_group="$(terraform output -raw resource_group_name)"
          backend_name="ca-obras-publicas-tst-backend"
          revision="$(az containerapp revision list --resource-group "$resource_group" --name "$backend_name" --query '[?properties.active].name | [0]' --output tsv)"
          if [[ -z "$revision" || "$revision" == "None" ]]; then
            az containerapp revision list --resource-group "$resource_group" --name "$backend_name" --query '[].{name:name,active:properties.active,provisioningState:properties.provisioningState}' --output table
            echo "No hay revision activa del backend para reiniciar" >&2
            exit 1
          fi
          az containerapp revision restart --resource-group "$resource_group" --name "$backend_name" --revision "$revision"

      - name: Verify six demo logins through frontend proxy
        shell: bash
        env:
          EXISTING_DEMO_PASSWORD: ${{ secrets.TEST_DEMO_PASSWORD }}
        run: |
          frontend="https://$(terraform output -raw frontend_fqdn)"
          for attempt in {1..18}; do
            if curl --silent --show-error --fail --max-time 15 "$frontend/api/health" >/dev/null; then
              break
            fi
            sleep 5
          done
          for username in personal.obras responsable jefe.cuadrilla operario inspector; do
            payload="$(jq -nc --arg username "$username" --arg password "$EXISTING_DEMO_PASSWORD" '{username:$username,password:$password}')"
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --header 'Content-Type: application/json' --data "$payload" "$frontend/api/auth/login")"
            if [[ "$code" != "200" ]]; then
              echo "Login anterior no valido para $username (HTTP $code)" >&2
              exit 1
            fi
          done
          new_payload="$(jq -c '.[] | select(.username == "ingeniero.arquitecto") | {username,password}' <<< "$TF_VAR_application_bootstrap_users_json")"
          test -n "$new_payload"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --header 'Content-Type: application/json' --data "$new_payload" "$frontend/api/auth/login")"
          if [[ "$code" != "200" ]]; then
            echo "Login de la sexta cuenta no valido (HTTP $code)" >&2
            exit 1
          fi
          echo "Seis logins correctos a traves del frontend: cinco existentes y uno nuevo."

      - name: Publish deployment result
        run: |
          {
            echo "## Test desplegado"
            echo
            echo "Referencia: \`${{ github.event.release.tag_name || inputs.release_tag }}\`"
            echo
            terraform output -no-color
          } >> "$GITHUB_STEP_SUMMARY"
