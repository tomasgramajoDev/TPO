name: Deploy test

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de la release aprobada que se desplegará en test.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-test
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && vars.ENABLE_AUTOMATIC_DEPLOYMENTS == 'true')
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: infra/terraform/live/test

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=test.terraform.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
          -lock-timeout=5m

      - name: Create plan
        run: terraform plan -input=false -lock-timeout=5m -out=test.tfplan

      - name: Render plan
        run: terraform show -no-color test.tfplan > test-plan.txt

      - name: Add plan to workflow summary
        shell: bash
        run: |
          {
            echo "## Terraform plan - test"
            echo
            echo '<details><summary>Ver plan</summary>'
            echo
            echo '```text'
            sed -n '1,1000p' test-plan.txt
            echo '```'
            echo '</details>'
            if [ "$(wc -l < test-plan.txt)" -gt 1000 ]; then
              echo
              echo "El resumen fue truncado. El plan completo está en el artefacto."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-plan
          path: |
            infra/terraform/live/test/test.tfplan
            infra/terraform/live/test/test-plan.txt
          retention-days: 7

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: infra/terraform/live/test

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=test.terraform.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
          -lock-timeout=5m

      - name: Download approved plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-test-plan
          path: infra/terraform/live/test

      - name: Show approved plan
        run: terraform show -no-color test.tfplan

      - name: Apply approved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve test.tfplan

      - name: Publish deployment result
        run: |
          {
            echo "## Test desplegado"
            echo
            echo "Referencia: \`${{ github.event.release.tag_name || inputs.release_tag }}\`"
            echo
            terraform output -no-color
          } >> "$GITHUB_STEP_SUMMARY"
