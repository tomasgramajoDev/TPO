name: QA encrypted demo credential handoff

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: RSA public key encoded as base64 for this one-time QA run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    env:
      PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
      DEMO_PASSWORD: ${{ secrets.TEST_DEMO_PASSWORD }}
    steps:
      - name: Encrypt credential for local QA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEMO_PASSWORD"
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > public.pem
          printf '%s' "$DEMO_PASSWORD" \
            | openssl pkeyutl -encrypt -pubin -inkey public.pem \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > encrypted.txt
          echo "ENCRYPTED_DEMO_PASSWORD=$(cat encrypted.txt)"
